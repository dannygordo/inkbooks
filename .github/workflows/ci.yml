name: CI

# Runs the full test suite (and the client production build) on every push to main and every PR
# targeting main. Two independent jobs, since server/ and apps/web/ are separate npm projects with
# their own package.json/lockfile - a failure in one shouldn't block visibility into the other.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches server/package.json's "engines": { "node": ">=20" } - @as-integrations/express5
          # enforces this at install time.
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # test/globalSetup.js downloads and runs a real, ephemeral mongodb-memory-server binary and
      # sets MONGODB_MEMORY_SERVER_URI/SECRET_KEY/NODE_ENV itself - no env vars or services need to
      # be configured here. Square/Firebase/email credentials are never touched by the suite; the
      # handful of tests that exercise those code paths set their own dummy values inline.
      - run: npm test

  client:
    name: Client tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm test

      # Not just "does it pass tests" - "does it actually still produce a deployable bundle."
      # Vite reads VITE_* env vars at build time; none of the current ones (Firebase config,
      # Square app id, GraphQL endpoint) change whether the build itself succeeds, so no secrets
      # are needed here just to confirm the app compiles.
      - run: npm run build
