<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- Vite serves everything under public/ from the site root, so plain "/favicon.ico" replaces
       CRA's "%PUBLIC_URL%/favicon.ico" - Vite has no equivalent placeholder and doesn't need one,
       since this file is no longer templated at build time the way CRA's was. -->
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Inkbooks - tattoo shop management" />
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <!-- Roboto is loaded alongside Source Sans Pro specifically for the calendar (ibCalendar.css),
       which matches Google Calendar's month-view typography. Google Calendar itself sets
       "Google Sans" first and falls back to Roboto - Google Sans is proprietary and not
       distributable, so Roboto is the closest legitimately available match. Only the 400/500/700
       weights are pulled; the calendar uses 500 almost everywhere (Google's UI weight of choice)
       and 400 for de-emphasized text. Source Sans Pro is unchanged and still the app-wide default
       via the `*` rule below. -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@200;300;400;600;700;900&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      font-family: 'Source Sans Pro', sans-serif;
      margin: 0;
    }
  </style>
  <title>Inkbooks</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!-- Vite's entry point is a real <script type="module"> tag pointing straight at the source
       entry file - unlike CRA, there's no separate build step that injects this tag for you, and
       no %PUBLIC_URL%-style templating happens in this file at all. -->
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
