# The logged-out self-service password reset request AND the token-redemption half it lands on -
# see apps/web's PasswordService.js's own header comment: every operation here runs with no
# session, by design.
#
# inspectPasswordToken/setPasswordWithToken were previously left unported here because the emailed
# link was a web-only URL with no mobile deep link registered for it (DECISIONS.md X24/X29). That
# changed when apps/mobile/src/app/set-password/[token].tsx was built: the app's own `inkbooks`
# scheme now handles inkbooks://set-password/<token> the same way expo-router handles any other
# path. The email itself still points at the web URL (server/utils/email.js's
# buildSetPasswordLink) rather than the app scheme directly - switching that over is a deliberate
# follow-up, not done here, since a bare custom-scheme link has no fallback for someone who taps it
# before installing the app. This screen is reachable today by anyone who already has the app and
# opens the link on the device it's installed on, or via a future Universal Link.
mutation RequestPasswordReset($email: String!) {
	requestPasswordReset(email: $email)
}

query InspectPasswordToken($token: String!) {
	inspectPasswordToken(token: $token) {
		valid
		purpose
		firstName
	}
}

mutation SetPasswordWithToken($token: String!, $newPassword: String!) {
	setPasswordWithToken(token: $token, newPassword: $newPassword)
}
