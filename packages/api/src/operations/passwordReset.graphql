# The logged-out self-service password reset request - see apps/web's PasswordService.js's own
# header comment: every operation here runs with no session, by design.
#
# ONLY requestPasswordReset is ported here, not inspectPasswordToken/setPasswordWithToken (the
# token-redemption half web's SetPassword.jsx handles). The emailed reset link is a web URL
# (server/utils/password-tokens.js has no mobile deep link registered for it - the same
# no-deep-link-back gap already named for Square OAuth in the Shops slice, DECISIONS.md X24), so
# redeeming it always opens in the phone's own browser regardless of whether a native screen
# exists for it. Building that screen on mobile would be unreachable dead code until a real deep
# link exists. See DECISIONS.md X29.
mutation RequestPasswordReset($email: String!) {
	requestPasswordReset(email: $email)
}
