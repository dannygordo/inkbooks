# Mirrors apps/web's Login.jsx LOGIN_USER mutation field-for-field, INCLUDING firebaseToken now -
# step 8's image-upload/Square follow-up added Firebase Storage sign-in to mobile (auth.tsx signs
# into Firebase with this the same way web's auth.jsx does), so there is now a caller for it here.
# See DECISIONS.md's X13 entry. userInfo's inline fragments are the three concrete UserInfo
# implementations (Artist/Client/Staff) straight off server/graphql/typeDefs.js - selecting shop.id
# on Artist/Staff now even though nothing reads it yet, since every shop-scoped query the
# appointments screen needs next (Phase 2) needs it and re-running codegen for one extra field
# later is pure overhead.
mutation Login($email: String!, $password: String!) {
	login(email: $email, password: $password) {
		id
		email
		firstName
		lastName
		avatar
		role
		userType
		tagColor
		themePreference
		accessToken
		firebaseToken
		userInfo {
			... on Artist {
				id
				firstName
				lastName
				avatar
				hourlyRate
				shop {
					id
					name
				}
			}
			... on Client {
				id
				firstName
				lastName
				avatar
			}
			... on Staff {
				id
				firstName
				lastName
				avatar
				title
				shop {
					id
					name
				}
			}
		}
	}
}
