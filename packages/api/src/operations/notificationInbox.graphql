# The in-app notification feed - gap #8 of HANDOFF.md's 2026-09-04 parity accounting. Direct port
# of apps/web's NotificationService.js's inbox half (GET_INBOX/MARK_READ/MARK_DONE) - the settings
# half (GetNotificationSettings/UpdateNotificationSettings) is gap #7's own separate operations
# file, already built (X51).
#
# Stored events and live conditions arrive merged and indistinguishable - see
# server/graphql/resolvers/notifications.js. `key` is the id for a stored one and a
# subject-derived string for a condition, so it's stable as a list key either way.
query GetInbox($includeRead: Boolean) {
	getInbox(includeRead: $includeRead) {
		unreadCount
		items {
			key
			type
			category
			subjectType
			subjectId
			title
			body
			amountCents
			createdAt
			readAt
			doneAt
			isCondition
		}
	}
}

mutation MarkNotificationsRead($notificationIds: [ID!]) {
	markNotificationsRead(notificationIds: $notificationIds)
}

mutation MarkNotificationsDone($notificationIds: [ID!]!) {
	markNotificationsDone(notificationIds: $notificationIds)
}
