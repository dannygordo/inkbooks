# Mobile's Messages slice - the last of X13's three still-unported items (Settings' avatar upload
# and the client-dashboard shared-images panel are the other two, X14/X15). Mirrors apps/web's
# MessengerService.js operation-by-operation, with the same "no message bodies on the list query"
# shape that file's own header comment explains: opening the inbox should not pull every message
# of every thread just to render a name and a badge. See DECISIONS.md X16 for what's deliberately
# not ported (live socket delivery, per-row "mark unread", search).

# Self-only server-side (getConversationsByMemberId throws AuthenticationError if memberId isn't
# the caller's own id - see resolvers/conversations.js) - always call with the signed-in user's
# own id. Sorted newest-activity-first by the server (Conversation.updatedAt, bumped on every new
# message), so no client-side sort is needed.
query GetConversationsByMemberId($memberId: ID!) {
	getConversationsByMemberId(memberId: $memberId) {
		id
		members
		updatedAt
		unreadCount
		membersInfo {
			id
			firstName
			lastName
			avatar
		}
	}
}

# One thread, fetched only when a conversation is opened - same lazy-on-purpose reasoning as
# web's own _fetchMessagesByConversationId. Guarded server-side by canAccessConversation (a
# member, or a shop admin at a member's shop).
query GetMessagesByConversationId($conversationId: ID!) {
	getMessagesByConversationId(conversationId: $conversationId) {
		id
		conversationId
		senderId
		message
		imageUrls
		createdAt
		user {
			firstName
			lastName
			avatar
		}
	}
}

# No timestamps sent - the server stamps them (see typeDefs.js's own comment on createMessage:
# thread order and unread state may not be caller-controlled). imageUrls omitted entirely from
# this slice's mutation call sites (mobile doesn't build the image-attachment compose flow yet -
# see DECISIONS.md X16) but kept in the schema call and response selection so the thread query
# above and this mutation's response shape stay interchangeable if that follow-up lands later.
mutation CreateMessage($conversationId: ID!, $senderId: ID!, $message: String, $imageUrls: [String!]) {
	createMessage(conversationId: $conversationId, senderId: $senderId, message: $message, imageUrls: $imageUrls) {
		id
		conversationId
		senderId
		message
		imageUrls
		createdAt
	}
}

# Idempotent - opening a thread twice costs one write and changes nothing the second time (see
# utils/conversation-reads.js's own header comment via MessengerService.js).
mutation MarkConversationRead($conversationId: ID!) {
	markConversationRead(conversationId: $conversationId) {
		id
		unreadCount
	}
}

# The header badge - one cheap server-side aggregation across every conversation the caller is
# in, not a sum of the list query's own per-row unreadCount (that would mean fetching the whole
# list just to total it). Polled, same as web's own sidebar badge - see index.tsx's own usage.
query GetUnreadMessageCount {
	getUnreadMessageCount
}
